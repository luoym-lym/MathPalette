<script>
const rows=JSON.parse(document.getElementById('data').textContent);let selected=location.hash.slice(1)||rows[0].id;const $=id=>document.getElementById(id);const append=(parent,tag,text,cls)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;parent.append(e);return e};
$('headline').textContent=`${rows.length} 道题 · ${rows.filter(r=>r.subject==='PlaneGeometry').length} 道平面 · ${rows.filter(r=>r.subject==='SolidGeometry').length} 道立体 · ${rows.filter(r=>r.manual).length} 道来源题意需确认`;
function chosenRows(){const q=$('search').value.toLowerCase();return rows.filter(r=>(r.id+' '+r.question).toLowerCase().includes(q)&&($('branch').value==='all'||r.subject===$('branch').value)&&($('filter').value==='all'||$('filter').value==='manual'&&r.manual||$('filter').value==='semantic'&&(r.fills.length||r.colors.length)))}
function renderList(){const vals=chosenRows();$('count').textContent=`显示 ${vals.length} / ${rows.length}`;$('list').replaceChildren();for(const r of vals){const b=append($('list'),'button',r.id+(r.manual?' · 需确认':''),r.id===selected?'chosen':'');b.onclick=()=>show(r.id)}if(!vals.length)append($('list'),'p','没有匹配题目','empty')}
function show(id){const r=rows.find(r=>r.id===id);if(!r)return;selected=id;history.replaceState(null,'','#'+id);renderList();const m=$('main');m.replaceChildren();const bar=append(m,'div',null,'toolbar');append(bar,'h2',r.id);append(bar,'span',r.subject==='PlaneGeometry'?'平面几何':'立体几何','badge');if(r.manual)append(bar,'span','来源题意需确认','badge warn');for(const [label,delta] of [['上一题',-1],['下一题',1]]){const b=append(bar,'button',label);b.onclick=()=>{const vals=chosenRows(),i=vals.findIndex(x=>x.id===id);if(vals[i+delta])show(vals[i+delta].id)}}const q=r.question.replace(/<image\d+>/gi,'').trim(),opts=Object.entries(r.choices||{}),imageOnly=opts.length>0&&opts.every(([k,v])=>String(v).replace(/[()\s]/g,'')===k);append(m,'div',imageOnly?q.replace(/\n\s*Choices\s*:[\s\S]*$/i,'').trim():q,'question');append(m,'p','来源答案：'+r.answer+'（本轮未改动）');const figs=append(m,'div',null,'figures');for(const [title,path] of [['来源图',r.source],['协议重绘',r.image]]){const f=append(figs,'figure');append(f,'figcaption',title);const b=append(f,'button'),img=append(b,'img');img.src=path;img.alt=r.id+' '+title;b.onclick=()=>{$('zoomimg').src=path;$('zoomimg').alt=img.alt;$('zoom').showModal()}}const findings=append(m,'section');append(findings,'h3','逐题视觉复核');append(findings,'p',Array.isArray(r.findings)?r.findings.join('\n'):r.findings||'详见逐题复核记录。');if(r.manual){append(findings,'p','重绘保留来源，不凭答案补充缺失条件。请先确认来源解释。','badge warn')}if(r.ambiguities.length){const a=append(m,'section');append(a,'h3','来源解释与表示限制');append(a,'pre',JSON.stringify(r.ambiguities,null,2));if(r.source_interpretation)append(a,'pre',JSON.stringify(r.source_interpretation,null,2))}const detail=append(m,'section');const d=append(detail,'details');append(d,'summary','必要视觉语义与复核文件');append(d,'pre',JSON.stringify({semantic_fills:r.fills,semantic_colors:r.colors},null,2));const links=append(d,'p',null,'links');for(const [label,name] of [['SVG','image.svg'],['冻结场景','scene.json'],['视觉复核','protocol_review.json'],['重绘报告','redraw_report.json'],['当前核验与历史证据','verification.json']]){const a=append(links,'a',label);a.href=r.path+'/'+name;a.target='_blank'}append(detail,'p','PNG SHA-256：'+r.hash,'small');paintMath()}
function paintMath(){if(typeof renderMathInElement==='function')renderMathInElement($('main').querySelector('.question'),{output:'mathml',throwOnError:false,delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]})}window.addEventListener('DOMContentLoaded',paintMath);
for(const id of ['search','branch','filter'])$(id).addEventListener(id==='search'?'input':'change',renderList);$('close').onclick=()=>$('zoom').close();$('zoom').onclick=e=>{if(e.target===$('zoom'))$('zoom').close()};show(selected);
</script></html>

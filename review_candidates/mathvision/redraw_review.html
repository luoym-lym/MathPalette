function setMode(value){mode=value;for(const button of document.querySelectorAll('[data-mode]'))button.setAttribute('aria-pressed',String(button.dataset.mode===mode));for(const panel of document.querySelectorAll('[data-stem]'))panel.classList.toggle('hidden',mode!=='both'&&panel.dataset.stem!==mode);const stems=document.querySelector('.stems');if(stems)stems.style.gridTemplateColumns=mode==='both'?'':'1fr'}
function show(id){const r=rows.find(r=>r.id===id);if(!r)return;selected=id;try{history.replaceState(null,'','#'+id)}catch(e){location.hash=id}const vals=list(),pos=vals.findIndex(x=>x.id===id),main=$('main');main.replaceChildren();const bar=add(main,'div',null,'toolbar');add(bar,'h2',r.id);add(bar,'span',r.subject==='PlaneGeometry'?'平面几何':r.subject==='SolidGeometry'?'立体几何':r.subject,'badge');add(bar,'span',r.changed?'已改写':'保留原题干','badge');add(bar,'span','待用户审核','badge pending');for(const [label,delta] of [['上一题',-1],['下一题',1]]){const b=add(bar,'button',label);b.type='button';b.disabled=pos<0||!vals[pos+delta];b.onclick=()=>show(vals[pos+delta].id)}const modes=add(main,'div',null,'modes');for(const [value,title] of [['both','前后对照'],['before','改写前'],['after','标准数学题干']]){const b=add(modes,'button',title);b.type='button';b.dataset.mode=value;b.onclick=()=>setMode(value)}const stems=add(main,'div',null,'stems');for(const [key,title] of [['before','改写前'],['after','标准数学题干']]){const p=add(stems,'div',null,'panel');p.dataset.stem=key;add(p,'h3',title);add(p,'div',r[key],'question')}add(main,'p','当前答案：'+String(r.answer)+'（本轮未改动）','answer');const figs=add(main,'div',null,'figures');for(const [title,path] of [['来源图',r.source],['协议重绘图',r.image]]){const f=add(figs,'figure');add(f,'figcaption',title);const b=add(f,'button');b.type='button';b.setAttribute('aria-label','放大 '+r.id+' '+title);const im=add(b,'img');im.src=path;im.alt=r.id+' '+title;im.loading='lazy';b.onclick=()=>{$('zoomtitle').textContent=r.id+' · '+title;$('zoomimg').src=path;$('zoomimg').alt=im.alt;$('zoom').showModal()}}const explanation=add(main,'section');add(explanation,'h3',r.changed?'改写依据':'保留依据');add(explanation,'p',r.reason);if(r.removed_context.length)add(explanation,'p','移除内容：'+r.removed_context.join('；'));add(explanation,'h3','条件保留说明');const ul=add(explanation,'ul');for(const fact of r.preserved_conditions)add(ul,'li',fact);add(explanation,'p','以上为题干整理与条件核对说明，不代表用户通过。原题选择项、公式和图像引用保留在题干中。','small');const detail=add(main,'details');add(detail,'summary','题干内容指纹');add(detail,'p','改写前 SHA-256：'+r.before_sha256,'small');add(detail,'p','当前 SHA-256：'+r.after_sha256,'small');setMode(mode);paintMath()}
function refresh(){const vals=matchingRows();if(vals.length&&!vals.some(r=>r.id===selected))selected=vals[0].id;if(vals.length)show(selected);else{list();$('main').replaceChildren();add($('main'),'p','没有匹配题目。请调整筛选或搜索词。')}}
for(const id of ['search','filter','branch'])$(id).addEventListener(id==='search'?'input':'change',refresh);
$('close').onclick=()=>$('zoom').close();$('zoom').onclick=e=>{if(e.target===$('zoom'))$('zoom').close()};
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(rows.some(r=>r.id===id))show(id)});
window.addEventListener('DOMContentLoaded',paintMath);if(selected)show(selected);else refresh();
</script></body></html>
